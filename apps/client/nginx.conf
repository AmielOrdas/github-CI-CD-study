# Static-file-only config (no reverse proxy — the frontend calls the API
# directly on :4000, which needs CORS approval from the Express side).

server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: any unknown path serves index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }
}