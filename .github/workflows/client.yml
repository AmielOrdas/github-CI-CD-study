# Builds and pushes ONLY the client image — runs when client code changes.
name: build-and-push-client

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Fail-safe filter: SKIP this workflow only when ALL changed files match
    # the ignore list (server-only changes, or docs-only pushes). Anything
    # unknown — new root files, lockfile, mixed changes — defaults to BUILDING,
    # so we can never silently end up with a stale image.
    paths-ignore:
      - "apps/server/**"
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - ".gitignore"

permissions:
  contents: read
  packages: write

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@e6428a5c4e294a61438ed7f43155db912025b6b3 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/client
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.6.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
        with:
          context: .
          file: ./apps/client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max